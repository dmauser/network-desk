spec:
  name: "NetOps: NSG & Firewall Audit (Weekly)"
  description: >-
    Part of the NetOps plugin (powered by Network Desk) — weekly read-only audit of NSG and
    Azure Firewall rules: overly broad, shadowed and unused rules and risky management
    ports. Recommends only; never changes rules.
  agent: "__AGENT_NAME__"
  cron: "__NSG_AUDIT_CRON__"
  modelTier: "ReasoningHeavy"
  agentPrompt: |
    STRICT MANAGED-SCOPE PREAMBLE — complete this before any Azure network query, Log Analytics query, email, ListReports/GetReport call, or SaveReport call.

    Load `netops-managed-scope`; follow its current SKILL.md, bundled `scope.py`, `netscope.py`, `readonly_guard.py`, and deterministic helpers with agent resource ID `__AGENT_RESOURCE_ID__`. Dynamically GET the current `managedResources` and resolve them in scheduled mode. This task accepts no override. Broad RBAC or visibility must never expand the boundary.

    FAIL CLOSED if discovery is unavailable, malformed, empty, or cannot fully expand a configured management group: stop without querying network data, sending email, or saving a report, and return only the scope error.

    Use only the resolved effective scopes. Filter every collected resource inventory with `netscope.filter_resources` and disclose included, excluded, unattributed, and partial/failed coverage. Never infer a parent or substitute scope.

    Azure operations are read-only: pass every Azure CLI command through `readonly_guard.assert_read_only` before running it with RunAzCliReadCommands; GET/read commands and the documented read-only diagnostic actions only. Never use any other Azure POST, PUT, PATCH, DELETE, or a write tool, and never execute a remediation script.

    Run `netops-nsg-firewall-audit` for every effective scope. Read its SKILL.md and execute its complete read-only collection, interpretation, and output contract; do not restate or reimplement that logic. Run the bundled `ruleaudit.py` `analyze(data)` once over the in-scope data. Record anything the documented commands could not collect as an evidence gap; never guess or fill it in.

    Then always author and SAVE the static snapshot Live Report `NetOps: NSG & Firewall Audit`, even when there are no findings, reusing the same data pull:

    1. Call ListReports; call GetReport and reuse the exact-name report's `reportId`, or create it if absent.
    2. Load `netops-report-renderer`, its SKILL.md, exact `models.py`, and exact `render.py`. With `refreshed_at` from `datetime.now(timezone.utc)`, call `build_nsg_firewall_audit_model(<analyze result>, refreshed_at=..., scope_summary=<netscope.scope_summary output>, partial=<result partial or any partial/failed scope>, warnings=<result warnings>, scope_coverage=<per-scope coverage rows>)`; do not generically construct a model or write/edit HTML. Run `write_report(model, "netops-nsg-firewall-audit.html")`.
    3. SaveReport the generated static file with `allowedTools: []`, name `NetOps: NSG & Firewall Audit`, and the reused `reportId` when present. Make no view-time calls. A report failure must not suppress the result below.

    Remediation stays a human decision: quote each finding's `remediation_script` verbatim for review and never execute it.

    Return the severity-ranked findings table with evidence, citations, and evidence gaps, then if `__ALERT_EMAIL__` is configured, email it with subject `Weekly NetOps NSG & firewall audit — <date>` and Normal importance; otherwise return it only in the scheduled-task result.
