spec:
  name: "NetOps: Monthly Review (KPI Scorecard)"
  description: >-
    Part of the NetOps plugin (powered by Network Desk) — the monthly NetOps review saved as
    a Live Report: KPI scorecard across hybrid health, private endpoint DNS, routing, rule
    hygiene, exposure, SNAT, IP capacity and flow-log coverage, with one prioritized action
    list.
  agent: "__AGENT_NAME__"
  cron: "__SCORECARD_CRON__"
  modelTier: "ReasoningHeavy"
  agentPrompt: |
    STRICT MANAGED-SCOPE PREAMBLE — complete this before any Azure network query, Log Analytics query, email, ListReports/GetReport call, or SaveReport call.

    Load `netops-managed-scope`; follow its current SKILL.md, bundled `scope.py`, `netscope.py`, `readonly_guard.py`, and deterministic helpers with agent resource ID `__AGENT_RESOURCE_ID__`. Dynamically GET the current `managedResources` and resolve them in scheduled mode. This task accepts no override. Broad RBAC or visibility must never expand the boundary.

    FAIL CLOSED if discovery is unavailable, malformed, empty, or cannot fully expand a configured management group: stop without querying network data, sending email, or saving a report, and return only the scope error.

    Use only the resolved effective scopes. Filter every collected resource inventory with `netscope.filter_resources` and disclose included, excluded, unattributed, and partial/failed coverage. Never infer a parent or substitute scope.

    Azure operations are read-only: pass every Azure CLI command through `readonly_guard.assert_read_only` before running it with RunAzCliReadCommands; GET/read commands and the documented read-only diagnostic actions only. Never use any other Azure POST, PUT, PATCH, DELETE, or a write tool, and never execute a remediation script.

    Build the monthly NetOps review for every effective scope. For each KPI skill — `netops-hybrid-health` (`hybrid.py`), `netops-private-endpoint-dns` (`pedns.py`), `netops-routing-analyzer` (`routing.py`), `netops-nsg-firewall-audit` (`ruleaudit.py`), `netops-exposure-scan` (`exposure.py`), `netops-snat-egress` (`snat.py`), `netops-ip-capacity` (`capacity.py`), and `netops-flow-insights` (`flows.py`) — read its SKILL.md, execute its complete read-only collection contract, and run its bundled `analyze(data)` once over the in-scope data. Do not restate or reimplement any engine logic. A skill whose data cannot be collected stays in the review as an evidence gap with its KPI shown as not measured; never guess a KPI value.

    Then always author and SAVE the static snapshot Live Report `NetOps: Monthly Review`, reusing the same data pull:

    1. Call ListReports; call GetReport and reuse the exact-name report's `reportId`, or create it if absent.
    2. Load `netops-report-renderer`, its SKILL.md, exact `models.py`, exact `scorecard.py`, and exact `render.py`. With `refreshed_at` from `datetime.now(timezone.utc)`, call `build_scorecard_model(<list of analyze results>, refreshed_at=..., scope_summary=<netscope.scope_summary output>, partial=<any result partial or any partial/failed scope>, warnings=<all result warnings>, scope_coverage=<per-scope coverage rows>)`; do not generically construct a model or write/edit HTML. Run `write_report(model, "netops-kpi-scorecard.html")`.
    3. SaveReport the generated static file with `allowedTools: []`, name `NetOps: Monthly Review`, and the reused `reportId` when present. Make no view-time calls. A report failure must not suppress the review below.

    Remediation stays a human decision: quote each finding's `remediation_script` verbatim for review and never execute it.

    Return the KPI scorecard (value, target, status per KPI), the KPIs that moved to warning or critical, and one prioritized action list grouped by skill, then if `__ALERT_EMAIL__` is configured, email it with subject `Monthly NetOps review — <month>` and Normal importance; otherwise return it only in the scheduled-task result.
