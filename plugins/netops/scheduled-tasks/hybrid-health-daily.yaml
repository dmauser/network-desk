apiVersion: azuresre.ai/v1
kind: ScheduledTask
metadata:
  name: "NetOps: Hybrid Connectivity Health (Daily)"
  owner: "__ALERT_EMAIL__"
  tags:
    - netops
    - netops-hybrid-health
    - netops-live-report
spec:
  name: "NetOps: Hybrid Connectivity Health (Daily)"
  description: >-
    Part of the NetOps plugin (powered by Network Desk) — daily read-only check of VPN and
    ExpressRoute gateways, connections, BGP peers and learned/advertised routes; always
    refreshes the Hybrid Health Live Report and emails only when a critical or high finding
    is detected.
  agent: "__AGENT_NAME__"
  cron: "__HYBRID_CRON__"
  modelTier: "ReasoningHeavy"
  agentPrompt: |
    STRICT MANAGED-SCOPE PREAMBLE — complete this before any Azure network query, Log Analytics query, email, ListReports/GetReport call, or SaveReport call.

    Load `netops-managed-scope`; follow its current SKILL.md, bundled `scope.py`, `netscope.py`, `readonly_guard.py`, and deterministic helpers with agent resource ID `__AGENT_RESOURCE_ID__`. Dynamically GET the current `managedResources` and resolve them in scheduled mode. This task accepts no override. Broad RBAC or visibility must never expand the boundary.

    FAIL CLOSED if discovery is unavailable, malformed, empty, or cannot fully expand a configured management group: stop without querying network data, sending email, or saving a report, and return only the scope error.

    Use only the resolved effective scopes. Filter every collected resource inventory with `netscope.filter_resources` and disclose included, excluded, unattributed, and partial/failed coverage. Never infer a parent or substitute scope.

    Azure operations are read-only: pass every Azure CLI command through `readonly_guard.assert_read_only` before running it with RunAzCliReadCommands; GET/read commands and the documented read-only diagnostic actions only. Never use any other Azure POST, PUT, PATCH, DELETE, or a write tool, and never execute a remediation script.

    Run `netops-hybrid-health` for every effective scope. Read its SKILL.md and execute its complete read-only collection, interpretation, and output contract; do not restate or reimplement that logic. Run the bundled `hybrid.py` `analyze(data)` once over the in-scope data. Record anything the documented commands could not collect as an evidence gap; never guess or fill it in.

    Then always author and SAVE the static snapshot Live Report `NetOps: Hybrid Health`, even when there are no findings, reusing the same data pull:

    1. Call ListReports; call GetReport and reuse the exact-name report's `reportId`, or create it if absent.
    2. Load `netops-report-renderer`, its SKILL.md, exact `models.py`, and exact `render.py`. With `refreshed_at` from `datetime.now(timezone.utc)`, call `build_hybrid_health_model(<analyze result>, refreshed_at=..., scope_summary=<netscope.scope_summary output>, partial=<result partial or any partial/failed scope>, warnings=<result warnings>, scope_coverage=<per-scope coverage rows>)`; do not generically construct a model or write/edit HTML. Run `write_report(model, "netops-hybrid-health.html")`.
    3. SaveReport the generated static file with `allowedTools: []`, name `NetOps: Hybrid Health`, and the reused `reportId` when present. Make no view-time calls. A report failure must not suppress the result below.

    Remediation stays a human decision: quote each finding's `remediation_script` verbatim for review and never execute it.

    If there are no critical or high findings, return exactly `No critical or high hybrid connectivity findings for <date>.` followed by any evidence gaps, and do not email. Otherwise return the severity-ranked findings table with evidence, citations, and evidence gaps, then if `__ALERT_EMAIL__` is configured, email it with subject `NetOps hybrid connectivity alert — <date>` and High importance; otherwise return it only in the scheduled-task result.
